openapi: 3.0.0
info:
  version: '1.0'
  title: Auth
  description: API for managing users in the Hat Heaven authentication microservice
  termsOfService: https://example.com/terms/
  contact:
    name: Hat-Heaven Team
    url: https://www.linkedin.com/in/ioannis-michailidis-a6b8711b7/
    email: michailidis.k.ioannis@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://hat-heaven.local:8080/api/orders
    description: Local development server with tunnel
  - url: http://hat-heaven.local:80/api/orders
    description: Local development server

paths:
  # ------------------------------------------------
  # USERS
  # ------------------------------------------------
  /login:
  # ----------------
  # POST
  # ----------------
    post:
      summary: Login User & get token
      description: Login a user
      tags:
        - Users
      security: [] # Public
      requestBody:
        required: true
        content:
          application/json:
            schema:
                type: object
                required:
                  - email
                  - password
                description: user object
                properties:
                  email:
                    type: string
                    format: email
                    description: The email address of the user
                    example: john.smith@gmail.com
                  password:
                    type: string
                    description: The password of the user
      responses:
        # Success
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        '401':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: A description of the error
                    example: Invalid email or password
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ------------------------------------------------
  /logout:
  # ----------------
  # POST
  # ----------------
    post:
      summary: Logout User / clear cookie
      description: Logout a user and clear the cookie
      tags:
        - Users
      # Private
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: A success message indicating that the user has been logged out successfully
                    example: Logged out succesfully
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ------------------------------------------------
  /:
  # ----------------
  # GET
  # ----------------
    get:
      summary: Get all users (Admin only)
      tags: [Admin]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ----------------
  # POST
  # ----------------
    post:
      summary: Register User
      description: Register a new user
      tags:
        - Users
      # Public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: A description of the error
                    example: User already exists
        '500':
          $ref: '#/components/responses/InternalServerError'
  /{id}:
    get:
      summary: Get user by ID (Admin only)
      tags: [Admin]
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      responses:
        '200':
          description: User object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'                            
  # ----------------
  # DELETE
  # ----------------
    delete:
      summary: Delete user by ID (Admin only)
      description: Delete a user by ID.
      tags:
        - Admin
      # Private
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'        
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message indicating that the user was deleted successfully.
                    example: User deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      summary: Update user by ID (Admin only)
      description: Update a user by ID.
      tags:
        - Admin
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
                type: object
                description: user object
                properties:
                  name:
                    type: string
                    description: The name of the user
                    example: John
                  email:
                    type: string
                    format: email
                    description: The email address of the user
                    example: john.smith@gmail.com
                  isAdmin:
                    type: boolean
                    description: The type of user
                    example: false
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ------------------------------------------------
  /profile:
  # ----------------
  # GET
  # ----------------
    get:
      summary: Get User Profile
      description: Retrieve the profile information of the authenticated user.
      tags:
        - Users
      # Private 
      security:
        - cookieAuth: []
      responses:
        # Success 
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        # Failure         
        '400':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message indicating that the user was not found.
                    example: User not found
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ----------------
  # PUT
  # ----------------
    put:
      summary: Update User Profile
      description: Update the profile of the authenticated user.
      tags:
        - Users
      # Private
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Error message indicating that the user was not found.
                    example: User not found
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ------------------------------------------------
components:
  # ------------------------------------------------
  # RESPONSES
  # ------------------------------------------------
  responses:
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: A description of the error
                example: An unexpected error occurred

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: User not found

  # ------------------------------------------------
  # SECURITY
  # ------------------------------------------------
  securitySchemes:
    # The basic one
    # BasicAuth:
    #   type: http
    #   scheme: basic
    # The JWT
    # JwtWuthToken:
    #   type: http
    #   scheme: bearer
    #   bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: jwt # JWT token is stored in a cookie 
  # ------------------------------------------------
  # PARAMETERS
  # ------------------------------------------------      
  parameters:
  # ----------------
  # PATH
  # ----------------
    UserIdParam:
      in: path
      name: id
      description: User Id
      required: true
      schema:
        type: string
  # ----------------
  # QUERY
  # ----------------

  # ------------------------------------------------
  # SCHEMAS
  # ------------------------------------------------
  schemas:
    # User
    User:
      type: object
      required:
        - name
        - email
        - password
      properties:
        _id:
          type: string
          format: uuid
          # readOnly: true
        name:
          type: string
          nullable: false
          example: John
        email:
          type: string
          format: email
          nullable: false
          example: john.smith@gmail.com
        password:
          type: string
          nullable: false
          writeOnly: true
        isAdmin:
          type: boolean
          nullable: false
          example: false

    UserInput:
      type: object
      properties:
        name:
          type: string
          nullable: false
          example: John
        email:
          type: string
          format: email
          nullable: false
          example: john.smith@gmail.com
        password:
          type: string
          nullable: false
          writeOnly: true